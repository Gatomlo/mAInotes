<!doctype html>
<html lang="fr-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes notes</title>
<meta name="theme-color" content="#0B6E6E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes notes" id="apple-title">
<link rel="manifest" href="manifest.json" id="manifest-link">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" id="apple-icon">
<script>
/* Avant tout chargement : manifeste choisi pour l'installation (accueil ou « Nouvelle note »). */
(function () {
  var q = location.search, pref = '';
  try { pref = localStorage.getItem('mainotes-install') || ''; } catch (e) {}
  if (/[?&]action=new/.test(q) || pref === 'new') {
    document.getElementById('manifest-link').href = 'manifest-new.json';
    document.getElementById('apple-icon').href = 'icons/new-apple-touch-icon.png';
    document.getElementById('apple-title').content = 'Nouvelle note';
  }
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<noscript>Cette application a besoin de JavaScript.</noscript>

<div class="wrap" id="auth" hidden></div>

<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand"><h1>Mes notes</h1><p class="sub" id="count"></p></div>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-home" aria-selected="true" data-a="tab" data-id="home">Notes</button>
      <button class="tab" role="tab" id="tab-cats" aria-selected="false" data-a="tab" data-id="cats">Carnets</button>
      <button class="tab" role="tab" id="tab-set" aria-selected="false" data-a="tab" data-id="set">Réglages</button>
      <button class="tab" role="tab" id="tab-account" aria-selected="false" data-a="tab" data-id="account">Compte</button>
    </div>
    <button class="btn primary add-desktop" data-a="add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nouvelle note</button>
  </header>

  <div id="banners"></div>

  <main id="view-home">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" aria-label="Rechercher dans les titres et le contenu" placeholder="Rechercher dans les titres et le contenu">
      <button class="iconbtn" id="qclear" data-a="qclear" aria-label="Effacer la recherche" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="chips" id="catchips" role="group" aria-label="Filtrer par carnet"></div>
    <div class="chips tags" id="tagchips" role="group" aria-label="Filtrer par tags"></div>
    <div class="toolbar">
      <div class="period"><label class="l" for="fperiod" style="margin:0">Créées</label>
        <select id="fperiod" class="field"><option value="">Toutes les dates</option><option value="today">Aujourd'hui</option><option value="7">7 derniers jours</option><option value="30">30 derniers jours</option><option value="month">Ce mois-ci</option><option value="year">Cette année</option><option value="custom">Période personnalisée…</option></select>
        <span id="fcustom" class="period" hidden><label for="ffrom">du</label><input id="ffrom" type="date" class="field"><label for="fto">au</label><input id="fto" type="date" class="field"></span>
      </div>
      <div class="modes" role="group" aria-label="Affichage"><button type="button" data-a="view" data-id="cards" aria-pressed="true">Cartes</button><button type="button" data-a="view" data-id="list" aria-pressed="false">Liste</button></div>
    </div>
    <div class="resinfo"><span id="resinfo" aria-live="polite"></span><span style="display:inline-flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="clearf" data-a="clearf" style="height:44px;padding:0 8px" hidden>Tout effacer</button><button class="btn ghost" data-a="trash-open" id="trashbtn" style="height:44px;padding:0 8px" hidden></button><button class="btn ghost" id="synthhist" data-a="hist-open" style="height:44px;padding:0 8px">Historique</button><button class="btn" id="synth" data-a="synth" style="height:44px;padding:0 14px" hidden></button></span></div>
    <div id="pendbar"></div>
    <div class="grid" id="grid"></div>
  </main>

  <main id="view-cats" hidden></main>
  <main id="view-set" hidden></main>
  <main id="view-account" hidden></main>
</div>

<button class="fab" data-a="add" aria-label="Ajouter une note" id="fab" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="overlay" id="ov" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Fenêtre"></section></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.js"></script>
<script src="js/modals.js"></script>
<script src="js/settings.js"></script>
<script src="js/events.js"></script>
</body>
</html>
